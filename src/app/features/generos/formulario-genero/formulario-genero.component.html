<form (submit)="guardarCambios()" [formGroup]="form" novalidate>
  <div class="mb-5">
    <label
      for="nombre"
      class="block mb-2 text-sm font-medium {{
        getNombreFieldRequiredError || getNombreFieldFirstLetterUppercaseError
          ? ' text-red-700 dark:text-red-500'
          : ''
      }}"
      >Nombre del género</label
    >
    <input
      type="text"
      required
      id="nombre"
      name="nombre"
      formControlName="nombre"
      class="block rounded-lg border mb-2 text-sm font-medium text-gray-900 dark:text-white w-full p-2.5 {{
        getNombreFieldRequiredError || getNombreFieldFirstLetterUppercaseError
          ? 'border-red-500 text-red-900 placeholder-red-700 focus:ring-red-500  focus:border-red-500 dark:text-red-500 dark:placeholder-red-500 dark:border-red-500'
          : ''
      }}"
      placeholder="Comedia"
    />

    @if(getNombreFieldErrors){ @if(getNombreFieldRequiredError){
    <p class="mt-2 text-sm text-red-600 dark:text-red-500">
      El nombre del género es requerido
    </p>
    } @if(getNombreFieldFirstLetterUppercaseError){
    <p class="mt-2 text-sm text-red-600 dark:text-red-500">
      La primera letra del nombre del género tiene que ir en mayúscula
    </p>
    }}
  </div>
  <div class="flex flex-col-reverse md:flex-row-reverse justify-between">
    <button
      class="flex flex-row gap-2 focus:outline-none disabled:bg-green-200 text-white bg-green-700 hover:bg-green-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-green-600 dark:hover:bg-green-700"
      type="submit"
      [disabled]="form.invalid"
    >
      @if(dto?.nombre !== ''){ Editar género } @else { Crear género }
    </button>
    <a
      class="flex flex-row gap-2 focus:outline-none text-white bg-gray-700 hover:bg-gray-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-gray-600 dark:hover:bg-gray-700"
      routerLink="/{{ generoRoute }}"
    >
      Volver
    </a>
  </div>
</form>
