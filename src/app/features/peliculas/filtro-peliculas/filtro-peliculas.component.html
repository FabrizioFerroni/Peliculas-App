<div class="flex flex-col md:flex-row w-full mt-10">
  <div class="w-full max-w-sm ml-3">
    <form
      [formGroup]="form"
      class="bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700 h-auto p-4 sm:p-6 md:p-8"
    >
      <h5 class="text-xl font-medium text-gray-900 dark:text-white mb-6">
        Buscar Películas
      </h5>
      <div class="mb-5">
        <label for="titulo" class="block mb-2 text-sm font-medium"
          >Título</label
        >
        <input
          type="text"
          required
          id="titulo"
          name="titulo"
          formControlName="titulo"
          class="block rounded-lg border mb-2 text-sm font-medium text-gray-900 dark:text-white w-full p-2.5"
          placeholder="Rapido y Furioso 10"
        />
      </div>
      <div class="mb-5">
        <label for="anioLanzamiento" class="block mb-2 text-sm font-medium"
          >Año</label
        >
        <input
          type="text"
          required
          id="anioLanzamiento"
          name="anioLanzamiento"
          formControlName="anioLanzamiento"
          class="block rounded-lg border mb-2 text-sm font-medium text-gray-900 dark:text-white w-full p-2.5"
          placeholder="2022"
        />
      </div>
      <div class="mb-5">
        <label for="genero" class="block mb-2 text-sm font-medium"
          >Género</label
        >
        <select
          id="genero"
          name="genero"
          formControlName="genero"
          class="block rounded-lg border mb-2 text-sm font-medium text-gray-900 dark:text-white w-full p-2.5"
        >
          <option selected value="">Selecciona un género</option>
          @for (item of generos; track $index) {
          <option value="{{ item.slug }}">{{ item.nombre }}</option>
          }
        </select>
      </div>
      <div class="flex items-center mb-5">
        <input
          id="proximosEstrenos"
          type="checkbox"
          value=""
          name="proximosEstrenos"
          formControlName="proximosEstrenos"
          class="cursor-pointer w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600"
        />
        <label
          for="proximosEstrenos"
          class="cursor-pointer ms-2 text-sm font-medium text-gray-900 dark:text-gray-300"
        >
          Próximos Estrenos
        </label>
      </div>
      <div class="flex items-center mb-5">
        <input
          id="enCines"
          type="checkbox"
          value=""
          name="enCines"
          formControlName="enCines"
          class="cursor-pointer w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600"
        />
        <label
          for="enCines"
          class="cursor-pointer ms-2 text-sm font-medium text-gray-900 dark:text-gray-300"
        >
          En Cines
        </label>
      </div>
      <div class="flex flex-col justify-between items-center">
        <button
          type="button"
          (click)="limpiar()"
          class="w-full justify-center items-center flex flex-row gap-2 focus:outline-none text-white bg-yellow-700 hover:bg-yellow-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-yellow-600 dark:hover:bg-yellow-700"
        >
          Limpiar
        </button>
      </div>
    </form>
  </div>

  @if(!isLoading){
  <div class="flex-grow p-4 sm:px-6 md:px-8">
    <app-listado-peliculas [peliculas]="peliculas"></app-listado-peliculas>
    <!-- Pagination -->
    <app-paginado
      *ngIf="!isLoading"
      [showCantPages]="false"
      [content]="peliculas"
      [page]="page"
      [size]="size"
      [totalElements]="totalElements"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [maxVisiblePages]="maxVisiblePages"
      [isFirst]="isFirst"
      [isLast]="isLast"
      [isFirstPage]="isFirstPage"
      [isLastPage]="isLastPage"
      (firstPage)="First()"
      (rewind)="rewind()"
      (forward)="forward()"
      (lastPage)="Last()"
      (setPage)="setPage($event)"
    />
    <!-- Fin Pagination -->
  </div>
  } @else {
  <div class="flex-grow text-center">
    <div class="flex items-center justify-center m-0 p-0">
      <app-cargando [width]="350" [height]="350" />
    </div>
    <p class="p-0 m-0 text-xl font-medium text-gray-900 dark:text-white">
      Cargando peliculas...
    </p>
  </div>
  }
</div>
