<div class="mb-4">
  @if (imgBase64) {
  <div class="flex justify-center items-center w-full">
    <img [src]="imgBase64" alt="Imagen" width="200" class="rounded-md" />
  </div>
  } @else if (urlImg) {
  <div class="flex justify-center items-center w-full">
    <img [src]="urlImg" alt="Imagen" width="200" class="rounded-md" />
  </div>
  }
</div>
<h4>{{ titulo }}</h4>
<div>
  <button
    type="button"
    class="flex flex-row gap-2 focus:outline-none text-white bg-orange-700 hover:bg-orange-800 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-orange-600 dark:hover:bg-orange-700"
    (click)="fileInput.click()"
  >
    Seleccionar imagen
  </button>
  <input
    type="file"
    name="foto"
    id="foto"
    hidden
    #fileInput
    accept="image/*"
    (change)="cambio($event)"
  />
</div>
